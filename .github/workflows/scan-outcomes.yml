name: Scan outcome checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-repository:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev
      - run: npm ci
      - run: npm run build
      - run: node --test tests/scanOutcome.test.js
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
